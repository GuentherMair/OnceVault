<html lang="en" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.ico">
<title>OnceVault</title>
<style>
/* "OnceVault Disc" mask font — generated by tools/gen_maskfont, embedded as a
   data: URI so the page stays self-contained (CSP allows font-src data:).
   EVERY Unicode codepoint maps to one centered disc at a fixed 600/1000em
   advance (cmap format 13): with BOTH the masked textarea and #mask using it
   as their first font, caret/selection/soft-wrap columns match the dots BY
   CONSTRUCTION — even for CJK/emoji. If it ever fails to load, both layers
   fall back to the SAME monospace stack, where the measured MASK_CHAR probe
   keeps ASCII alignment. */
@font-face{
  font-family:'OnceVault Disc';
  src:url(data:font/ttf;base64,AAEAAAAKAIAAAwAgT1MvMlsQXOMAAACsAAAAYGNtYXAAfwLAAAABDAAAAQ5nbHlmAnEEwQAAAhwAAAA4aGVhZGFuQ08AAAJUAAAANmhoZWEE1QI4AAACjAAAACRobXR4BLAApQAAArAAAAAIbG9jYQAcAAAAAAK4AAAABm1heHAABAAKAAACwAAAACBuYW1lDaIg0QAAAuAAAADGcG9zdP+fADMAAAOoAAAAIAAEAlgBkAAFAAACigJYAAAASwKKAlgBXgBLADIA+gAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAABPVkxUAEAAIP//AyD/OAAAAyAAyAAAAAEAAAAAAfQCvAAAACAAAQAAAAIAAwABAAAAFAADAAoAAADyAAQA3gAAAAQABAABAAAAfv//AAAAIP//AAAAAQAEAAAAAQABAAEAAQABAAEAAQABAAEAAQABAAEAAQABAAEAAQABAAEAAQABAAEAAQABAAEAAQABAAEAAQABAAEAAQABAAEAAQABAAEAAQABAAEAAQABAAEAAQABAAEAAQABAAEAAQABAAEAAQABAAEAAQABAAEAAQABAAEAAQABAAEAAQABAAEAAQABAAEAAQABAAEAAQABAAEAAQABAAEAAQABAAEAAQABAAEAAQABAAEAAQABAAEAAQABAAEAAQABAA0AAAAAABwAAAAAAAAAAQAAAAAAEP//AAAAAQAAAAEApQCvAbMBvQAHAAAAAAAAAAAAAAGz/9j/of+h/9gAKABfAF8BNgBfACj/2P+h/6H/2AAoAAAAAQAAAAEAAPju+3dfDzz1AAMD6AAAAAAAAAAAAAAAAAAAAAAApQCvAbMBvQAAAAYAAgAAAAAAAAABAAADIP84AAACWAAAAKUBswABAAAAAAAAAAAAAAAAAAAAAgJYAAACWAClAAAAAAAcAAAAAQAAAAIACAABAAAAAAACAAAAAAAAAAAAAAAAAAAAAAAAAAUAQgADAAEECQABABwAAAADAAEECQACAA4AHAADAAEECQADACQAKgADAAEECQAEABwATgADAAEECQAGABoAagBPAG4AYwBlAFYAYQB1AGwAdAAgAEQAaQBzAGMAUgBlAGcAdQBsAGEAcgBPAG4AYwBlAFYAYQB1AGwAdABEAGkAcwBjAC0AMgAwADIANgBPAG4AYwBlAFYAYQB1AGwAdAAgAEQAaQBzAGMATwBuAGMAZQBWAGEAdQBsAHQARABpAHMAYwAAAAMAAAAAAAD/nAAyAAAAAQAAAAAAAAAAAAAAAAAAAAA=) format('truetype');
}
/* ---- theme tokens: light is the base, dark applies via prefers-color-scheme
   (system default) or an explicit data-theme="dark" on <html> ---- */
:root{
  color-scheme:light dark;
  --bg:#ffffff;
  --fg:#202124;
  --muted:#5f6368;
  --border:#dfe1e5;
  --pill-bg:#ffffff;
  --pill-shadow:0 1px 6px rgba(32,33,36,.28);
  --btn-bg:#f8f9fa;
  --hover-bg:rgba(60,64,67,.08);
  --focus:#1a73e8;
  --dialog-bg:#ffffff;
  --backdrop:rgba(32,33,36,.5);
  /* tri-state output: yellow (link) / green (secret) / red (error), darker font tones */
  --y-bg:#fef7e0; --y-fg:#7a5901;
  --g-bg:#e6f4ea; --g-fg:#18632f;
  --r-bg:#fce8e6; --r-fg:#a50e0e;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#202124;
    --fg:#e8eaed;
    --muted:#9aa0a6;
    --border:#5f6368;
    --pill-bg:#303134;
    --pill-shadow:0 1px 6px rgba(0,0,0,.5);
    --btn-bg:#303134;
    --hover-bg:rgba(232,234,237,.1);
    --focus:#8ab4f8;
    --dialog-bg:#2d2e31;
    --backdrop:rgba(0,0,0,.6);
    --y-bg:#41361a; --y-fg:#fdd663;
    --g-bg:#1e3427; --g-fg:#81c995;
    --r-bg:#3c1f1d; --r-fg:#f28b82;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#202124;
  --fg:#e8eaed;
  --muted:#9aa0a6;
  --border:#5f6368;
  --pill-bg:#303134;
  --pill-shadow:0 1px 6px rgba(0,0,0,.5);
  --btn-bg:#303134;
  --hover-bg:rgba(232,234,237,.1);
  --focus:#8ab4f8;
  --dialog-bg:#2d2e31;
  --backdrop:rgba(0,0,0,.6);
  --y-bg:#41361a; --y-fg:#fdd663;
  --g-bg:#1e3427; --g-fg:#81c995;
  --r-bg:#3c1f1d; --r-fg:#f28b82;
}
:root[data-theme="light"]{color-scheme:light}

*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none !important}
html,body{height:100%}
body{
  font-family:arial,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);
  color:var(--fg);
  display:flex;
  flex-direction:column;
  min-height:100%;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none !important;animation:none !important}
}

/* ---- top-right corner: theme cycler + help ---- */
.topbar{display:flex;justify-content:flex-end;gap:6px;padding:14px 18px}
.iconbtn{
  display:inline-flex;align-items:center;justify-content:center;
  padding:8px;border-radius:50%;color:var(--muted);
  transition:background-color .12s;
}
.iconbtn:hover{background:var(--hover-bg)}
.iconbtn svg{width:22px;height:22px;display:block}
/* language picker: an invisible native <select> stretched over the globe icon,
   so one tap opens the browser's own accessible option list */
.langbtn{position:relative}
.langbtn select{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;cursor:pointer}
.langbtn:focus-within{outline:2px solid var(--focus);outline-offset:2px;border-radius:50%}
/* eye toggle: same eye shape; .revealed on the button adds a strike-through */
.iconbtn #iEyeSlash{display:none}
.iconbtn.revealed #iEyeSlash{display:inline}
/* theme button shows the icon of the CURRENT mode */
.iconbtn .t-ico{display:none}
html[data-theme="system"] .i-system{display:block}
html[data-theme="dark"]   .i-dark{display:block}
html[data-theme="light"]  .i-light{display:block}

/* ---- centered search-page layout ---- */
main{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0 16px 14vh;
}
.wordmark{
  font-size:clamp(52px,9vw,84px);
  font-weight:500;
  letter-spacing:-.03em;
  margin-bottom:30px;
  user-select:none;
}
.wm-once{
  background:linear-gradient(90deg,
    color-mix(in srgb, var(--muted) 15%, transparent),
    var(--muted));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

/* ---- pill input row ---- */
form{
  width:min(92%,700px);
  margin-inline:90px; /* min distance from input to window border */
  display:flex;flex-direction:column;align-items:center
}
.pill{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  width:100%;max-width:700px;min-height:48px;
  padding:0 10px 0 16px; /* left keeps the input's 16px breathing room; right matches the select's top/bottom */
  /* fixed radius = half the single-line height; 9999px would balloon as the
     textarea grows and curl the border into the text */
  border:1px solid var(--border);border-radius:24px;
  background:var(--pill-bg);
  transition:box-shadow .12s,border-color .12s;
}
.pill:hover,.pill:focus-within{box-shadow:var(--pill-shadow);border-color:transparent}
/* expanded: the value no longer fits between the icons on one row — the
   textarea takes a full-width row of its own (copy-icon's left edge to the
   dropdown's right edge); copy stays front-left, eye+duration end-right on a
   second row the text can never reach (a separate flex line) */
.pill.expanded .secret-wrap{flex-basis:100%;order:-1}
.pill.expanded #eyeBtn{margin-left:auto}
/* keep the icons/dropdown row at the same distance from the pill's bottom
   border as the centered icons have in the one-line layout (measured 8px
   inside the border) — without this they sit attached to the border */
.pill.expanded{padding-bottom:8px}
.secret-wrap{flex:1;min-width:0;position:relative;display:flex}
.pill textarea{
  width:100%;min-width:0;
  border:0;outline:0;background:transparent;
  /* masked: the 'OnceVault Disc' font (see @font-face) renders EVERY character
     at one fixed advance, identical in this textarea and in #mask — caret,
     selection, and soft-wrap columns match the dots by construction, even for
     CJK/emoji. The monospace stack behind it is the degraded mode if the
     embedded font fails, with the measured MASK_CHAR probe guarding the dot.
     .revealed restores the page font — the only state in which the text is
     actually read. */
  font-family:'OnceVault Disc',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:16px;line-height:24px;
  padding:12px 0;height:48px; /* one line by default; JS grows it up to 15 lines */
  resize:none;overflow-y:hidden;
  /* masked by default: glyphs transparent (caret stays), #mask paints the dots.
     -webkit-text-security is no use here — it masks newlines too, collapsing
     multi-line content onto a single line of dots. */
  color:transparent;caret-color:var(--fg);
  /* the mask is one unbreakable run of '*' per input line and can only wrap at
     the fill width — the masked textarea must wrap identically, or spaces and
     hyphens would break its lines earlier and caret/dots drift apart row by row */
  word-break:break-all;
}
.pill textarea.revealed{color:inherit;font-family:inherit;word-break:normal}
/* selection while masked: pin BOTH properties — color:transparent alone can
   leave no visible feedback at all (UA-dependent), while an unpinned text
   color leaks glyphs in Firefox/Safari. The tint shows the selected range;
   the text itself stays invisible. Revealed mode keeps the native selection. */
html:not(.discfont) .pill textarea:not(.revealed)::selection{
  color:transparent;
  background:color-mix(in srgb,var(--focus) 30%,transparent);
}
/* ---- disc-font mode: the font itself is the mask ----
   With 'OnceVault Disc' confirmed loaded (JS adds .discfont on <html>), the
   textarea simply shows its own glyphs — every character IS a disc, and text
   controls even paint the space glyph — so caret, selection, soft-wrap, and
   dots agree BY IDENTITY; the mirror is superfluous and hidden. No dot-layer
   can fully imitate real text (spaces get special line-breaking treatment in
   every white-space mode), which is why imitation is abandoned rather than
   refined. Without .discfont (font failed/blocked) the transparent-text +
   #mask mirror above stays active, so a missing font never shows plaintext. */
.discfont .pill textarea:not(.revealed){color:var(--fg)}
.discfont #mask{display:none}
/* the placeholder is always visible text — keep it in the page font */
.pill textarea::placeholder{color:var(--muted);font-family:arial,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#mask{ /* dot-for-glyph mirror of the textarea, newlines kept; never any plaintext.
        Its break-word matches the masked textarea's break-all for this content
        (spaceless runs): both wrap only at the fill width, so every row holds
        the same characters */
  position:absolute;inset:0;overflow:hidden;pointer-events:none;
  font-family:'OnceVault Disc',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; /* MUST equal the masked textarea's stack */
  font-size:16px;line-height:24px;
  padding:12px 0;
  white-space:pre-wrap;overflow-wrap:break-word;
  color:var(--fg);
}
.pill .iconbtn{padding:6px}
.pill .iconbtn svg{width:20px;height:20px}
.pill select{
  appearance:none;-webkit-appearance:none;
  border:1px solid var(--border);border-radius:9999px;
  background-color:var(--btn-bg);color:inherit;
  font-size:14px;padding:6px 22px 6px 10px;
  cursor:pointer;
  /* custom chevron (appearance:none removes the native one) */
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat:no-repeat;
  background-position:right 9px center;
  background-size:10px 10px;
}
@media (max-width:640px){
  /* On narrow screens the 92% width already gives ample space; the explicit
     90px margin would force horizontal overflow. */
  form{margin-inline:0}
}

/* ---- action buttons, Google-Search style ---- */
.actions{margin-top:28px;display:flex;gap:10px;justify-content:center}
.action-btn{
  background:var(--btn-bg);
  border:1px solid transparent;border-radius:4px;
  font-size:14px;padding:10px 18px;color:var(--fg);
  transition:box-shadow .12s,border-color .12s;
}
.action-btn:hover{border-color:var(--border);box-shadow:0 1px 1px rgba(0,0,0,.1)}

/* ---- tri-state output panel ---- */
.out{
  position:relative;
  width:min(92%,700px);max-width:700px;
  margin-top:30px;
  border-radius:16px;
  padding:16px 84px 16px 22px;
  min-height:calc(2 * 1.5 * 13px + 32px); /* two text rows + padding */
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:13px;line-height:1.5;
}
.out-text{white-space:pre-wrap;word-break:break-all}
.out-encrypt{background:var(--y-bg);color:var(--y-fg)}
.out-decrypt{background:var(--g-bg);color:var(--g-fg)}
.out-error  {background:var(--r-bg);color:var(--r-fg)}
.out-tools{position:absolute;top:8px;right:10px;display:flex;gap:2px}
.out-tools .iconbtn{color:inherit;opacity:.75;padding:6px}
.out-tools .iconbtn:hover{opacity:1}
.out-tools svg{width:17px;height:17px}
@media (max-width:640px){
  .out{padding-right:72px}
}

/* ---- help dialog ---- */
dialog{
  border:0;border-radius:12px;
  background:var(--dialog-bg);color:var(--fg);
  width:calc(100% - 32px);max-width:560px;
  padding:26px 30px;
  margin:auto;
}
dialog::backdrop{background:var(--backdrop)}
dialog h2{font-size:20px;font-weight:500;margin-bottom:12px;padding-right:36px}
dialog h3{font-size:12px;font-weight:600;margin:18px 0 8px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
dialog p{font-size:14px;line-height:1.55;margin-bottom:12px}
dialog blockquote{margin:0 0 12px;padding:8px 12px;border-left:3px solid var(--y-fg);border-radius:0 6px 6px 0;font-size:14px;line-height:1.55}
dialog ul{font-size:14px;line-height:1.55;margin:0 0 12px 20px}
dialog li{margin-bottom:4px}
.dlg-close{position:absolute;top:14px;right:14px}
.dlg-license{margin:18px 0 0;font-size:12px;color:var(--muted)}
.dlg-license a{color:inherit}
.chip{
  display:inline-block;width:.85em;height:.85em;border-radius:3px;
  margin-right:6px;vertical-align:-.06em;
}
.chip-y{background:var(--y-bg);border:1px solid var(--y-fg)}
.chip-g{background:var(--g-bg);border:1px solid var(--g-fg)}
.chip-r{background:var(--r-bg);border:1px solid var(--r-fg)}
</style>
<script>
/* stamp the stored theme before first paint so a stored choice that differs
   from the OS scheme never flashes the wrong theme; the main script at the
   end of <body> remains the single owner of all further theme handling */
'use strict';
try{
  var earlyTheme=localStorage.getItem('oncevault-theme');
  if(earlyTheme==='dark'||earlyTheme==='light') document.documentElement.dataset.theme=earlyTheme;
}catch(e){}
</script>
</head>
<body>

<nav class="topbar">
  <div id="langBtn" class="iconbtn langbtn" title="Language">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
    <select id="langSel" aria-label="Language">
      <option value="en">English</option>
      <option value="bg">Български</option>
      <option value="cs">Čeština</option>
      <option value="da">Dansk</option>
      <option value="de">Deutsch</option>
      <option value="el">Ελληνικά</option>
      <option value="es">Español</option>
      <option value="et">Eesti</option>
      <option value="fi">Suomi</option>
      <option value="fr">Français</option>
      <option value="ga">Gaeilge</option>
      <option value="hr">Hrvatski</option>
      <option value="hu">Magyar</option>
      <option value="it">Italiano</option>
      <option value="lt">Lietuvių</option>
      <option value="lv">Latviešu</option>
      <option value="mt">Malti</option>
      <option value="nl">Nederlands</option>
      <option value="pl">Polski</option>
      <option value="pt">Português</option>
      <option value="ro">Română</option>
      <option value="sk">Slovenčina</option>
      <option value="sl">Slovenščina</option>
      <option value="sv">Svenska</option>
      <option value="tr">Türkçe</option>
      <option value="ko">한국어</option>
      <option value="zh">中文</option>
    </select>
  </div>
  <button id="themeBtn" class="iconbtn" type="button" title="Theme: system → dark → light" aria-label="Cycle color theme">
    <svg class="t-ico i-system" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
    <svg class="t-ico i-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="t-ico i-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  </button>
  <button id="helpBtn" class="iconbtn" type="button" title="About OnceVault" aria-label="Help">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
  </button>
</nav>

<main>
  <h1 class="wordmark"><span class="wm-once">Once</span>Vault</h1>

  <form id="form" autocomplete="off">
    <div id="pill" class="pill">
      <button id="copyInBtn" class="iconbtn" type="button" title="Copy" aria-label="Copy secret">
        <svg id="iCopyIn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <svg id="iCheckIn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><polyline points="20 6 9 17 4 12"/></svg>
      </button>
      <div class="secret-wrap">
        <textarea id="secret" rows="1" placeholder="Message" aria-label="Message"
               autocomplete="one-time-code" autocapitalize="off" autocorrect="off"
               spellcheck="false"
               data-lpignore="true" data-1p-ignore data-bwignore></textarea>
        <pre id="mask" aria-hidden="true"></pre>
      </div>
      <button id="eyeBtn" class="iconbtn" type="button" title="Show secret" aria-label="Toggle secret visibility">
        <svg id="iEye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/><line id="iEyeSlash" x1="2" y1="2" x2="22" y2="22"/></svg>
      </button>
      <select id="duration" aria-label="Expires after">
        <option value="1">1h</option>
        <option value="4">4h</option>
        <option value="8">8h</option>
        <option value="24" selected>1d</option>
        <option value="48">2d</option>
        <option value="120">5d</option>
        <option value="168">7d</option>
      </select>
    </div>
    <div class="actions">
      <button id="encBtn" class="action-btn" type="submit">Encrypt</button>
      <button id="genBtn" class="action-btn" type="button">Generate secret</button>
    </div>
  </form>

  <div id="out" class="out" hidden>
    <div class="out-tools">
      <button id="copyBtn" class="iconbtn" type="button" title="Copy" aria-label="Copy to clipboard">
        <svg id="iCopy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <svg id="iCheck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><polyline points="20 6 9 17 4 12"/></svg>

  /* Exact contract error strings (docs/PLAN_STEP_0.md §0.2) → i18n keys, so
     server responses can be localized without the server knowing languages. */
  var SRV_KEYS={
    "secret expired or was already retrieved":"srvTaken",
    "secret expired before it was retrieved":"srvExpired",
    "rate limit exceeded, try again later":"srvRate",
    "access blocked":"srvBlocked",
    "unexpected backend failure":"srvBackend",
    "secret exceeds maximum allowed size":"srvTooLarge"
  };

  /* stored choice wins; otherwise first browser language with a table; else en */
  var lang=null;
  try{
    var storedLang=localStorage.getItem('oncevault-lang');
    if(storedLang&&I18N[storedLang]) lang=storedLang;
  }catch(e){}
  if(!lang){
    var cands=navigator.languages||[navigator.language||''];
    for(var ci=0;ci<cands.length&&!lang;ci++){
      var primaryTag=String(cands[ci]).toLowerCase().split('-')[0];
      if(I18N[primaryTag]) lang=primaryTag;
    }
    if(!lang) lang='en';
  }
  function tr(k){
    var t=I18N[lang];
    return t&&t[k]!==undefined?t[k]:I18N.en[k];
  }
  function trSrv(msg){ var k=SRV_KEYS[msg]; return k?tr(k):msg; }
  function refreshEyeTitle(){
    eyeBtn.title=eyeBtn.classList.contains('revealed')?tr('eyeHide'):tr('eyeShow');
    eyeBtn.setAttribute('aria-label',eyeBtn.title);
  }
  function applyLang(){
    document.documentElement.lang=lang;
    langSel.value=lang;
    langBtn.title=tr('lang');
    langSel.setAttribute('aria-label',tr('lang'));
    input.placeholder=tr('secret');
    input.setAttribute('aria-label',tr('secret'));
    encBtn.textContent=tr('encrypt');
    genBtn.textContent=tr('generate');
    themeBtn.title=tr('theme');
    themeBtn.setAttribute('aria-label',tr('theme'));
    helpBtn.title=tr('help');
    helpBtn.setAttribute('aria-label',tr('help'));
    refreshEyeTitle();
    durationSel.setAttribute('aria-label',tr('durAria'));
    var dur=tr('dur');
    for(var i=0;i<durationSel.options.length;i++) durationSel.options[i].textContent=dur[i];
    copyBtn.title=tr('copy'); copyBtn.setAttribute('aria-label',tr('copy'));
    copyInBtn.title=tr('copy'); copyInBtn.setAttribute('aria-label',tr('copy'));
    closeBtn.title=tr('close'); closeBtn.setAttribute('aria-label',tr('close'));
    dlgClose.title=tr('close'); dlgClose.setAttribute('aria-label',tr('close'));
    var n=document.querySelectorAll('[data-i18n]');
    for(i=0;i<n.length;i++) n[i].textContent=tr(n[i].getAttribute('data-i18n'));
    n=document.querySelectorAll('[data-i18n-html]');
    for(i=0;i<n.length;i++) n[i].innerHTML=tr(n[i].getAttribute('data-i18n-html'));
  }
  langSel.addEventListener('change',function(){
    lang=langSel.value;
    try{ localStorage.setItem('oncevault-lang',lang); }catch(e){}
    applyLang();
    input.focus();
  });
  applyLang();

  /* ---- output panel ---- */
  function showOutput(state,text){
    out.className='out out-'+state;   /* encrypt | decrypt | error */
    outText.textContent=text;
    if(state!=='error'){              /* success: the plaintext is done with */
      input.value='';
      input.style.height='';          /* back to the one-line default */
      input.style.overflowY='';
      renderMask();
    }                                 /* error: keep the typed secret intact */
    form.hidden=true;                 /* then hide it */
    out.hidden=false;
  }
  function resetUrl(){ history.replaceState(null,'',location.pathname); }
  closeBtn.addEventListener('click',function(){
    outText.textContent='';
    out.hidden=true;
    out.className='out';
    form.hidden=false;                /* show input again */
    setRevealed(false);               /* every new cycle starts masked */
    resetUrl();
    input.focus();
  });
  copyBtn.addEventListener('click',function(){
    navigator.clipboard.writeText(outText.textContent).then(function(){
      iCopy.hidden=true; iCheck.hidden=false;
      setTimeout(function(){ iCopy.hidden=false; iCheck.hidden=true; },1200);
    }).catch(function(){});
  });

  /* ---- eye toggle: masking = transparent glyphs + dot mirror in #mask ---- */
  function setRevealed(reveal){
    input.classList.toggle('revealed',reveal);
    eyeBtn.classList.toggle('revealed',reveal);
    refreshEyeTitle();
    relayout();                      /* height adapts to the toggled font; the row layout stays fixed on the mask */
  }
  eyeBtn.addEventListener('click',function(){
    setRevealed(!input.classList.contains('revealed'));
    input.focus();
  });

  /* in-pill copy: clipboard gets the real value (dots live only in #mask);
     no-op on empty input, same as encrypt */
  function copyInputAll(){
    if(!input.value) return;
    navigator.clipboard.writeText(input.value).then(function(){
      iCopyIn.hidden=true; iCheckIn.hidden=false;
      setTimeout(function(){ iCopyIn.hidden=false; iCheckIn.hidden=true; },1200);
    }).catch(function(){});
    input.focus();
  }
  copyInBtn.addEventListener('click',copyInputAll);

  /* The mask dot. With the embedded 'OnceVault Disc' font active, EVERY
     character — '•' included — renders as the same fixed-advance disc, so the
     probe below trivially passes and '•' is used. The probe still matters for
     the degraded mode (disc font failed to load, both layers on the monospace
     stack): there '•' is only safe when the RESOLVED mono font contains it at
     the shared advance — a bullet substituted from a fallback font wraps its
     rows at different points than the glyph rows and the drift compounds per
     row. Measure once at load with the mask's own computed font: 40 bullets
     vs 40 'x' (40 glyphs amplify any advance difference far beyond float
     rounding); on mismatch fall back to ASCII '*', same advance by
     construction. */
  var MASK_CHAR=(function(){
    try{
      var ms=getComputedStyle(mask);
      var probe=document.createElement('pre');
      probe.style.cssText='position:absolute;visibility:hidden;white-space:pre;margin:0;padding:0;border:0;letter-spacing:normal';
      probe.style.fontFamily=ms.fontFamily;
      probe.style.fontSize=ms.fontSize;
      document.body.appendChild(probe);
      probe.textContent=new Array(41).join('x');
      var wx=probe.getBoundingClientRect().width;
      probe.textContent=new Array(41).join('•');
      var wd=probe.getBoundingClientRect().width;
      probe.remove();
      if(wx>0&&Math.abs(wd-wx)<0.5) return '•'; /* <0.0125px per glyph */
    }catch(e){}
    return '*';
  })();

  /* disc-font mode gate: only after the embedded font is confirmed available
     does the masked textarea show its own fg-colored discs and the mirror
     hide (.discfont on <html>, see CSS). On any failure we simply stay in
     mirror mode — a missing font can never reveal plaintext. */
  if(document.fonts&&document.fonts.load){
    document.fonts.load('16px "OnceVault Disc"').then(function(){
      if(document.fonts.check('16px "OnceVault Disc"'))
        document.documentElement.classList.add('discfont');
    }).catch(function(){});
  }

  /* renderMask mirrors the value into #mask as one MASK_CHAR per character,
     newlines kept — so the masked view shows the real line structure without
     plaintext. The /u flag counts astral characters as one dot (one glyph),
     not two surrogate halves. */
  function renderMask(){
    mask.textContent=input.classList.contains('revealed')?'':input.value.replace(/[^\n]/gu,MASK_CHAR);
    mask.scrollTop=input.scrollTop;
  }
  input.addEventListener('scroll',function(){ mask.scrollTop=input.scrollTop; });

  /* ---- textarea auto-grow: one line by default, cap at 15 lines then scroll ---- */
  var MAX_INPUT_H=15*24+24; /* 15 lines x 24px line-height + 24px vertical padding */
  function autosize(){
    input.style.height='auto';
    input.style.height=Math.min(input.scrollHeight,MAX_INPUT_H)+'px';
    input.style.overflowY=input.scrollHeight>MAX_INPUT_H?'auto':'hidden';
  }

  /* ---- expanded pill layout ----
     When the value no longer fits on one row between the icons (or contains
     newlines), .expanded sends the textarea to a full-width row of its own and
     copy/eye/duration to a second row; deleting back to a fitting single line
     restores the compact row. The fit test ALWAYS measures at the compact
     width — the wider expanded row fits more text and would make the
     threshold oscillate — and ALWAYS in the monospace mask font, so toggling
     the eye (mono ↔ page font) can never flip the layout. */
  var COMPACT_H=48; /* == .pill textarea height: one 24px line + 12px*2 padding */
  function relayout(){
    var was=pill.classList.contains('expanded');
    var want=true;
    if(input.value.indexOf('\n')<0){
      if(was) pill.classList.remove('expanded');   /* measure at compact width */
      var rev=input.classList.contains('revealed');
      if(rev) input.classList.remove('revealed');  /* ...and in the mono mask font */
      input.style.height='auto';
      want=input.scrollHeight>COMPACT_H;
      if(rev) input.classList.add('revealed');
      if(was) pill.classList.add('expanded');      /* real state set below */
    }
    pill.classList.toggle('expanded',want);
    autosize();     /* height still follows the CURRENT font: it must fit the text as displayed */
    renderMask();
  }
  input.addEventListener('input',relayout);
  /* the pill is width:min(92%,700px), so a resize can change what fits
     without any typing — re-check, throttled to one relayout per frame */
  var relayoutQueued=false;
  window.addEventListener('resize',function(){
    if(relayoutQueued) return;
    relayoutQueued=true;
    requestAnimationFrame(function(){ relayoutQueued=false; relayout(); });
  });

  /* ENTER submits (as the old single-line input did); ALT+ENTER inserts a
     newline, and so does SHIFT+ENTER (near-universal muscle memory).
     Shortcut bindings (active while the input is focused):
       F1                       open help
       Cmd/Ctrl-G               generate a random secret
       Cmd/Ctrl-Shift-C         copy full input to clipboard (overrides browser reopen-tab on the same combo for F1/T)
       Cmd/Ctrl-Shift-T         cycle theme (system → dark → light → system)
     Modifier key: metaKey (Cmd on macOS) OR ctrlKey, so both platforms work. */
  input.addEventListener('keydown',function(e){
    if(e.isComposing) return;
    var mod=(e.metaKey||e.ctrlKey)&&!e.altKey;
    if(e.key==='F1'&&!mod&&!e.shiftKey){
      e.preventDefault();
      if(!helpDlg.open) helpDlg.showModal();
      return;
    }
    if(e.key==='g'&&!e.shiftKey&&mod){
      e.preventDefault();
      if(e.repeat) return;
      doGenerate();
      return;
    }
    if(e.key==='C'&&e.shiftKey&&mod){
      e.preventDefault();
      copyInputAll();
      return;
    }
    if(e.key==='T'&&e.shiftKey&&mod){
      e.preventDefault();             /* override browser reopen-closed-tab */
      cycleTheme();
      return;
    }
    if(e.key!=='Enter') return;
    e.preventDefault();
    if(e.altKey||e.shiftKey){
      input.setRangeText('\n',input.selectionStart,input.selectionEnd,'end');
      relayout();                     /* setRangeText fires no input event */
    }else if(input.value){
      encrypt();
    }
  });

  /* ---- duration dropdown ---- */
  durationSel.addEventListener('change',function(){ input.focus(); });

  /* ---- help dialog ---- */
  helpBtn.addEventListener('click',function(){ helpDlg.showModal(); });
  dlgClose.addEventListener('click',function(){ helpDlg.close(); });
  helpDlg.addEventListener('close',function(){ input.focus(); });

  /* ---- secret generator: 16 chars from a curated charset, at least one of each class ----
     Rejection sampling keeps the modulo fair (bytes >= floor(256/n)*n are dropped);
     Fisher-Yates shuffle prevents the four required characters from pinning to the head. */
  var GEN_UPPER="ABCDEFGHJKLMNPQRSTUVWXYZ",   /* 24 — exclude I, O */
      GEN_LOWER="abcdefghijkmnopqrstuvwxyz",   /* 25 — exclude l */
      GEN_DIGIT="23456789",                    /*  8 — exclude 0, 1 */
      GEN_SPECIAL="-_.",                       /*  3 */
      GEN_FULL=GEN_UPPER+GEN_LOWER+GEN_DIGIT+GEN_SPECIAL; /* 60 */
  function genUniform(n){
    var limit=Math.floor(256/n)*n;
    var b=new Uint8Array(1);
    while(true){ crypto.getRandomValues(b); if(b[0]<limit) return b[0]%n; }
  }
  function genPickChar(set){ return set[genUniform(set.length)]; }
  function generateSecret(){
    var chars=[genPickChar(GEN_UPPER),genPickChar(GEN_LOWER),genPickChar(GEN_DIGIT),genPickChar(GEN_SPECIAL)];
    for(var i=4;i<16;i++) chars.push(genPickChar(GEN_FULL));
    for(var k=chars.length-1;k>0;k--){
      var j=genUniform(k+1);
      var t=chars[k]; chars[k]=chars[j]; chars[j]=t;
    }
    return chars.join('');
  }
  function doGenerate(){
    if(busy) return;                  /* an encrypt is mid-flight and reads input.value async — don't swap its plaintext */
    if(!window.crypto||!crypto.getRandomValues){
      showOutput('error',tr('errNoCryptoGen'));
      return;
    }
    input.value=generateSecret();
    relayout();
    input.focus();
  }
  genBtn.addEventListener('click',doGenerate);

  /* ---- encrypt flow ----
     SECURITY INVARIANT: the plaintext and the key NEVER appear in any request.
     Only ciphertext + IV + duration are POSTed; the key goes into the local
     #fragment of the displayed link and nowhere else. */
  var busy=false;
  form.addEventListener('submit',function(e){
    e.preventDefault();               /* native form submit prevented */
    if(input.value) encrypt();        /* button click no-op on empty input (ENTER handled on keydown) */
  });
  function encrypt(){
    if(busy) return;
    if(!window.crypto||!crypto.subtle){
      showOutput('error',tr('errNoCryptoEnc'));
      return;
    }
    busy=true;
    var rawKey;
    crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt','decrypt'])
      .then(function(key){
        var iv=crypto.getRandomValues(new Uint8Array(12));
        return Promise.all([
          crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,new TextEncoder().encode(input.value)),
          crypto.subtle.exportKey('raw',key),
          iv
        ]);
      })
      .then(function(r){
        var ct=r[0]; rawKey=r[1]; var iv=r[2];
        return fetch('/api/secrets',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({
            secret:bytesToB64(ct),
            iv:bytesToB64(iv),
            duration:Number(durationSel.value)
          })
        });
      })
      .then(function(res){
        return res.json().catch(function(){ return {}; }).then(function(data){
          if(res.status===201&&data.guid){
            showOutput('encrypt',location.origin+'/?guid='+data.guid+'#'+bytesToB64Url(rawKey));
          }else{
            showOutput('error',data.error?trSrv(data.error):tr('errHttp').replace('{0}',res.status));
          }
        });
      })
      .catch(function(){
        showOutput('error',tr('errNetwork'));
      })
      .then(function(){ busy=false; });
  }

  /* ---- decrypt-on-load ----
     SECURITY INVARIANT: the GET uses the GUID only. The fragment (key) is read
     from location.hash, used exclusively by crypto.subtle.importKey below, and
     is never concatenated into any URL, body or header. */
  function decryptOnLoad(){
    var guid=new URLSearchParams(location.search).get('guid');
    var frag=location.hash.replace(/^#/,'');
    if(!guid||!UUID_RE.test(guid)) return;
    if(!KEY_RE.test(frag)){
      /* mail clients and chat apps strip fragments: tell the recipient the
         key is missing instead of failing silently — and do NOT fetch, so
         a keyless visit never consumes the secret */
      showOutput('error',tr('errKeyMissing'));
      resetUrl();
      return;
    }
    if(!window.crypto||!crypto.subtle){
      showOutput('error',tr('errNoCryptoDec'));
      resetUrl();
      return;
    }
    /* strip guid+key from the address bar BEFORE any network activity — the
       key is already captured in `frag`, and leaving it visible for the whole
       fetch would expose it to shoulder surfing and screen recordings */
    resetUrl();
    fetch('/api/secrets/'+guid)
      .then(function(res){
        if(res.ok){
          return res.json().then(function(body){
            /* the b64 decodes run inside the guarded chain so any throw
               reports a decrypt failure, not a network error */
            return Promise.resolve()
              .then(function(){
                return crypto.subtle.importKey('raw',b64ToBytes(frag),{name:'AES-GCM'},false,['decrypt']);
              })
              .then(function(key){
                return crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(body.iv)},key,b64ToBytes(body.secret));
              })
              .then(function(pt){
                showOutput('decrypt',new TextDecoder().decode(pt));
              })
              .catch(function(){
                showOutput('error',tr('errDecrypt'));
              });
          });
        }
        return res.json().catch(function(){ return {}; }).then(function(data){
          showOutput('error',data.error?trSrv(data.error):tr('errHttp').replace('{0}',res.status));
        });
      })
      .catch(function(){
        showOutput('error',tr('errNetwork'));
      });
  }
  decryptOnLoad();
  if(!form.hidden) input.focus();
})();
</script>
</body>
</html>
